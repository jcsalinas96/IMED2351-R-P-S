<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            color: #243b53;
            padding: 30px 15px;
        }

        h1 {
            font-size: 2.5rem;
        }

        .buttons {
            margin: 25px 0;
        }

        button {
            background: #243b53;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            margin: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #486581;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 30px auto;
            max-width: 700px;
        }

        .player-card {
            background: white;
            border: 3px solid #4a90e2;
            border-radius: 18px;
            padding: 20px;
            width: 230px;
        }

        .computer-card {
            border-color: #52b788;
        }

        .hand {
            font-size: 100px;
            margin: 20px 0;
            display: inline-block;
        }

        .shake {
            animation: shake 0.7s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            20%, 60% {
                transform: translateY(-20px) rotate(-15deg);
            }
            40%, 80% {
                transform: translateY(0) rotate(15deg);
            }
        }

        .vs {
            font-size: 28px;
            font-weight: bold;
        }

        #result {
            font-size: 26px;
            font-weight: bold;
            margin: 25px 0 10px;
        }

        #details {
            font-size: 18px;
        }

        #score {
            font-size: 20px;
            font-weight: bold;
            margin: 25px;
        }

        @media (max-width: 550px) {
            h1 {
                font-size: 2rem;
            }

            .player-card {
                width: 100%;
                max-width: 250px;
            }

            .vs {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Rock, Paper, Scissors!</h1>
    <p>Choose your move and challenge the computer!</p>

    <div class="buttons">
        <button onclick="playGame('rock')">✊ Rock</button>
        <button onclick="playGame('paper')">🖐️ Paper</button>
        <button onclick="playGame('scissors')">✌️ Scissors</button>
    </div>

    <div class="game">

        <div class="player-card">
            <h2>YOU</h2>
            <div id="playerHand" class="hand">✊</div>
            <p id="playerChoice">Choose your move!</p>
        </div>

        <div class="vs">VS</div>

        <div class="player-card computer-card">
            <h2>COMPUTER</h2>
            <div id="computerHand" class="hand">✊</div>
            <p id="computerChoice">Ready to play!</p>
        </div>

    </div>

    <div id="result">Let's play!</div>
    <p id="details">Rock beats scissors. Paper beats rock.</p>
    <p id="score">Player: 0 | Computer: 0</p>

    <button onclick="resetGame()">Play Again / Reset Score</button>

    <script>
        // Array of possible moves
        const choices = ["rock", "paper", "scissors"];

        // Object containing the hand emojis
        const hands = {
            rock: "✊",
            paper: "🖐️",
            scissors: "✌️"
        };

        // Score variables
        let playerScore = 0;
        let computerScore = 0;
        let isPlaying = false;

        // Play the game
        function playGame(playerMove) {

            if (isPlaying) return;
            isPlaying = true;

            // Disable buttons while hands animate
            document.querySelectorAll(".buttons button")
                .forEach(button => button.disabled = true);

            const playerHand = document.getElementById("playerHand");
            const computerHand = document.getElementById("computerHand");

            // Start with fists
            playerHand.textContent = "✊";
            computerHand.textContent = "✊";

            document.getElementById("result").textContent =
                "Rock... Paper... Scissors...";

            document.getElementById("playerChoice").textContent =
                "Ready...";

            document.getElementById("computerChoice").textContent =
                "Ready...";

            // Animate both hands
            playerHand.classList.remove("shake");
            computerHand.classList.remove("shake");

            // Restart the animation
            void playerHand.offsetWidth;

            playerHand.classList.add("shake");
            computerHand.classList.add("shake");

            // Computer randomly picks a move
            const computerMove =
                choices[Math.floor(Math.random() * choices.length)];

            // Reveal both moves after the animation
            setTimeout(function() {

                playerHand.classList.remove("shake");
                computerHand.classList.remove("shake");

                playerHand.textContent = hands[playerMove];
                computerHand.textContent = hands[computerMove];

                document.getElementById("playerChoice").textContent =
                    "You chose " + playerMove + "!";

                document.getElementById("computerChoice").textContent =
                    "Computer chose " + computerMove + "!";

                // Determine the winner
                let message;

                if (playerMove === computerMove) {
                    message = "It's a tie!";
                } else if (
                    (playerMove === "rock" &&
                        computerMove === "scissors") ||
                    (playerMove === "paper" &&
                        computerMove === "rock") ||
                    (playerMove === "scissors" &&
                        computerMove === "paper")
                ) {
                    message = "🎉 You win!";
                    playerScore++;
                } else {
                    message = "💻 Computer wins!";
                    computerScore++;
                }

                document.getElementById("result").textContent =
                    message;

                document.getElementById("details").textContent =
                    playerMove + " vs. " + computerMove;

                document.getElementById("score").textContent =
                    "Player: " + playerScore +
                    " | Computer: " + computerScore;

                // Allow another round
                isPlaying = false;

                document.querySelectorAll(".buttons button")
                    .forEach(button => button.disabled = false);

            }, 750);
        }

        // Reset scores and display
        function resetGame() {

            if (isPlaying) return;

            playerScore = 0;
            computerScore = 0;

            document.getElementById("playerHand").textContent = "✊";
            document.getElementById("computerHand").textContent = "✊";

            document.getElementById("playerChoice").textContent =
                "Choose your move!";

            document.getElementById("computerChoice").textContent =
                "Ready to play!";

            document.getElementById("result").textContent = "Let's play!";

            document.getElementById("details").textContent =
                "Rock beats scissors. Paper beats rock.";

            document.getElementById("score").textContent =
                "Player: 0 | Computer: 0";
        }
    </script>

</body>
</html>
